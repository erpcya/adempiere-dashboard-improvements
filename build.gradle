plugins {
	id 'java-library'
	id 'maven-publish'
}

sourceCompatibility = 1.17
targetCompatibility = 1.17
def baseVersion = '3.9.4'
def baseGroupId = 'io.github.adempiere'

repositories {
    mavenLocal()
    mavenCentral()
}

allprojects {
    tasks.withType(Javadoc) {
    	options.addStringOption('Xdoclint:none', '-quiet')
   	}
}

dependencies {
   api fileTree(
        dir: 'lib',
        include: [
            '*.jar'
        ]
    )
    //	ADempiere Core
    api "${baseGroupId}:base:${baseVersion}"
}

sourceSets {
    main {
         java {
            srcDirs = ['src/main/java']
         }
    }
}

java {
    withJavadocJar()
    withSourcesJar()
}


//  Signing is a Maven Central requirement. GitHub Packages does not verify
//  signatures, and a build that stops for a missing key nobody set is a build
//  that fails for a rule that does not apply here.
//  signing {
//      sign configurations.archives
//  }

def entityType = 'D'
version = System.getenv("ADEMPIERE_LIBRARY_VERSION") ?: "local-1.0.0"
//  The coordinate this publishes under, stated here rather than only in an
//  organization secret that no reader of this file can see. The variable still
//  overrides it, which is how a fork changes its own group without changing
//  everybody's — but a checkout with nothing configured publishes under the same
//  coordinate as the rest of these libraries instead of under whatever the
//  organization happens to hold.
def customGroupId = System.getenv("ADEMPIERE_LIBRARY_GROUP") ?: "io.github.adempiere"

jar {
	manifest {
		attributes(
			"Implementation-Title": "ADempiere Dashboard Improvements",
			"Implementation-Version": version,
			"EntityType": entityType
		)
    }
}

publishing {
    repositories {
        maven {
            //  This fork's own packages. Central carries upstream's artifact under
            //  the same coordinate, and what this repository builds is not that.
            //  The property still overrides it, for a repository that genuinely
            //  publishes elsewhere.
            url = findProperty("deployPublishUrl")
                    ?: "https://maven.pkg.github.com/erpcya/adempiere-dashboard-improvements"
            credentials {
                username = System.getenv("GITHUB_DEPLOY_USER") ?: findProperty("sonatypeUsername")
                password = System.getenv("GITHUB_DEPLOY_TOKEN") ?: findProperty("sonatypePassword")
            }
        }
    }
    publications {
        mavenJava(MavenPublication) {
			groupId = customGroupId
			artifactId = 'adempiere-dashboard-improvements'
			version = version
           	from components.java
           	pom {
                name = 'ADempiere Dashboard Improvements'
                description = 'This project allows improve the dashboard use for ADempiere for new UI'
                url = 'http://adempiere.io/'
                licenses {
                    license {
                        name = 'GNU General Public License, version 2'
                        url = 'https://www.gnu.org/licenses/old-licenses/gpl-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'yamelsenih'
                        name = 'Yamel Senih'
                        email = 'ysenih@erpya.com'
                    }
                }
                scm {
                    //  The fork, not upstream. Whoever follows this from a
                    //  published artifact wants the source that produced it.
                    connection = 'scm:git:git://github.com/erpcya/adempiere-dashboard-improvements.git'
                    developerConnection = 'scm:git:ssh://github.com/erpcya/adempiere-dashboard-improvements.git'
                    url = 'http://github.com/erpcya/adempiere-dashboard-improvements'
                }
            }
		}
	}
}


task cleanBuildPublishLocal(type: GradleBuild) {
	tasks = ['clean', 'build', 'publishToMavenLocal']
}
